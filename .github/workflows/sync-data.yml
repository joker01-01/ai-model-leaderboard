name: Refresh leaderboard data

on:
  schedule:
    # 每天北京时间 01:20；避免与整点高峰重叠。
    - cron: "20 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-data-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Fetch official snapshots
        run: npm run sync:data
        env:
          # 未配置时仍会更新 Arena；AA 主指数会保持上一次已核验快照。
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
      - name: Verify generated data builds
        run: npm run build
      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated data/sync-report.json
          if git diff --cached --quiet; then
            echo "No data changes; skip push."
          else
            git commit -m "chore: refresh official leaderboard snapshots"
            git push origin HEAD:main
          fi
