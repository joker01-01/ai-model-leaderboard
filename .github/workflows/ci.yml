name: Verify pull request

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Check generated ModelOps data
        run: npm run modelops:data:check
      - name: Test ModelOps data contracts
        run: npm run test:modelops-data
      - name: Build production frontend
        run: npm run build
      - name: Test backend tools and graph
        working-directory: backend
        run: python -m pytest -q
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests evals
      - name: Type-check backend
        working-directory: backend
        run: python -m mypy app tests evals
      - name: Run deterministic Agent evaluations
        working-directory: backend
        run: python evals/run.py
