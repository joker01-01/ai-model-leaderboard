[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelops-agent-backend"
version = "0.1.0"
description = "Bounded ModelOps Agent over the AI Model Leaderboard evidence adapter"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "langgraph>=1.2.9,<1.3",
  "pydantic>=2.13.4,<2.14",
  "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
  "anyio>=4,<4.15",
  "httpx2>=2.12,<2.13",
  "mypy>=1.11,<2",
  "pytest>=8.4,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unused_ignores = true
